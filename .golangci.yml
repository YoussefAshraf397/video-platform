# Shared golangci-lint config for every Go module in the repo (contracts/, media-worker/).
version: "2"

linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint            # wrap/compare errors with %w, errors.Is/As
    - gosec                # security: the media worker handles untrusted files
    - misspell
    - noctx                # HTTP requests must carry a context (timeouts, cancellation)
    - revive
    - unconvert
  exclusions:
    rules:
      # Tests read fixture files by name (G304); that is not attacker-controlled input.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
